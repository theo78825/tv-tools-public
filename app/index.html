<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV Tools</title>
<script src="view.js"></script>
<style>
  :root {
    --bg: #111114;
    --panel: #1c1c21;
    --panel-focus: #25252c;
    --button: #2a2a31;
    --text: #f2f2f4;
    --muted: #9a9aa6;
    --on: #4cc38a;
    --off: #e5484d;
    --warn: #f5a524;
    --accent: #b0ce0a;
    --focus: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--text);
    font-family: "LG Smart UI", "Museo Sans", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  header {
    position: absolute;
    top: 96px;
    left: 200px;
    right: 200px;
    display: flex;
    align-items: center;
    gap: 36px;
  }
  header img {
    width: 104px;
    height: 104px;
    border-radius: 24px;
  }
  header h1 {
    font-size: 80px;
    font-weight: 600;
    margin: 0;
  }
  #cards {
    position: absolute;
    top: 256px;
    bottom: 190px;
    left: 180px;
    right: 180px;
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    overflow: hidden; /* scrolled from app.js so the focused card stays in view */
  }
  .card { flex-shrink: 0; }
  .toggles {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  button.toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
    min-width: 680px;
    padding: 22px 28px 22px 48px;
  }
  button.toggle .pill {
    font-size: 30px;
    border-radius: 999px;
    padding: 8px 26px;
    background: #3a3a44;
    color: var(--muted);
  }
  /* A hidden row is the state this card is for, so it reads green. */
  button.toggle[data-hidden="true"] .pill {
    background: rgba(76, 195, 138, 0.18);
    color: var(--on);
  }
  .card {
    display: flex;
    align-items: center;
    gap: 64px;
    background: var(--panel);
    border: 4px solid transparent;
    border-radius: 36px;
    padding: 44px 56px;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .card:focus-within {
    background: var(--panel-focus);
    border-color: #3a3a44;
  }
  .card .text { flex: 1; }
  .card .eyebrow {
    font-size: 26px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .card h2 {
    font-size: 56px;
    font-weight: 600;
    margin: 0 0 14px;
  }
  .card .desc {
    font-size: 32px;
    line-height: 1.4;
    color: var(--muted);
    margin: 0;
  }
  .state { color: var(--muted); }
  .state.on { color: var(--on); }
  .state.off { color: var(--off); }
  /* For cards where "off" is the good state (the pointer): colour by meaning. */
  .state.good { color: var(--on); }
  .state.bad { color: var(--off); }
  #net { margin-left: auto; text-align: right; }
  #net .ip { display: block; font-size: 44px; font-weight: 600; }
  #net .via { display: block; font-size: 26px; color: var(--muted); margin-top: 4px; }
  .state.warn { color: var(--warn); }
  /* Health card: summary and button on top, a 3-column list of checks below. */
  .card.health { flex-wrap: wrap; row-gap: 28px; padding-top: 36px; padding-bottom: 36px; }
  .health .checks {
    flex-basis: 100%;
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px 48px;
  }
  .health .checks li {
    display: grid;
    grid-template-columns: 20px 1fr;
    column-gap: 18px;
    align-items: baseline;
    align-content: start; /* no gap when a neighbour's detail wraps */
  }
  .health .dot {
    grid-row: span 2;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #55555f;
    align-self: start;
    margin-top: 10px;
  }
  .health li[data-level="ok"] .dot { background: var(--on); }
  .health li[data-level="warn"] .dot { background: var(--warn); }
  .health li[data-level="bad"] .dot { background: var(--off); }
  /* Leaner LG card: text on top, a 2-column grid of toggles below. */
  .card.lean { flex-wrap: wrap; row-gap: 28px; padding-top: 36px; padding-bottom: 36px; }
  .lean .toggles {
    flex-basis: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 32px;
  }
  .lean button.toggle { min-width: 0; padding: 12px 24px 12px 36px; }
  .lean .toggle .label { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
  .lean .toggle .name { font-size: 34px; }
  .lean .toggle .sub { font-size: 24px; font-weight: 400; color: var(--muted); }
  /* Services card: one line per toggle (name, then the process name). */
  .lean.compact .toggle .label { flex-direction: row; align-items: baseline; gap: 16px; }
  .lean.compact .toggle .sub { font-size: 26px; }
  .lean.compact button.toggle { padding-top: 6px; padding-bottom: 6px; }
  .lean button.toggle[data-off="true"] .pill { background: rgba(76, 195, 138, 0.18); color: var(--on); }
  .health .label { font-size: 30px; font-weight: 600; }
  .health .detail { font-size: 26px; line-height: 1.35; color: var(--muted); }
  .health li[data-level="warn"] .detail,
  .health li[data-level="bad"] .detail { color: var(--text); }
  button {
    font: inherit;
    font-size: 38px;
    font-weight: 600;
    color: var(--text);
    background: var(--button);
    border: 4px solid transparent;
    border-radius: 999px;
    padding: 24px 60px;
    min-width: 340px;
    outline: none;
    white-space: nowrap;
    transition: transform 120ms ease, background 120ms ease;
  }
  button:focus {
    border-color: var(--focus);
    background: #34343d;
    transform: scale(1.05);
  }
  button:disabled { opacity: 0.5; }
  button.danger:focus { background: #5a1f22; border-color: var(--off); }
  #error {
    position: absolute;
    left: 200px;
    right: 200px;
    bottom: 150px;
    font-size: 30px;
    color: var(--off);
    margin: 0;
  }
  footer {
    position: absolute;
    left: 200px;
    bottom: 80px;
    font-size: 28px;
    color: var(--muted);
  }
  #dialog {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.72);
  }
  #dialog.open { display: flex; }
  #dialog .box {
    width: 1040px;
    background: var(--panel);
    border-radius: 40px;
    padding: 64px 72px;
  }
  #dialog h2 { font-size: 60px; margin: 0 0 20px; }
  #dialog p { font-size: 34px; line-height: 1.4; color: var(--muted); margin: 0 0 56px; }
  #dialog .actions { display: flex; gap: 32px; }
</style>
</head>
<body>
<header>
  <img src="largeIcon.png" alt="">
  <h1>TV Tools</h1>
  <div id="net"><span class="ip"></span><span class="via"></span></div>
</header>
<main id="cards"></main>
<p id="error"></p>
<footer>Up and down to move &middot; OK to select &middot; Back to exit</footer>

<div id="dialog" role="dialog" aria-modal="true">
  <div class="box">
    <h2 id="dialog-title"></h2>
    <p id="dialog-body"></p>
    <div class="actions">
      <button id="dialog-cancel">Cancel</button>
      <button id="dialog-ok" class="danger"></button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<!-- One script per card, shown in this order. -->
<script src="features/health.js"></script>
<script src="features/pointer.js"></script>
<script src="features/home.js"></script>
<script src="features/launcher.js"></script>
<script src="features/keyhook.js"></script>
<script src="features/screensaver.js"></script>
<script src="features/lean.js"></script>
<script src="features/lean-services.js"></script>
<script src="features/power.js"></script>
<script>TVTools.start();</script>
</body>
</html>
